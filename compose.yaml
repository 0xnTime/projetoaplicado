name: cantina

services:
  db:
    image: docker.io/library/postgres:17-alpine
    container_name: cantina-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cantina}
      POSTGRES_USER: ${POSTGRES_USER:-cantina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cantina}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: docker.io/library/adminer:latest
    container_name: cantina-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db

volumes:
  db-data:
