name: cantina

x-bun: &bun
  image: localhost/cantina-bun:latest
  build:
    context: .
    dockerfile: Containerfile
  working_dir: /repo
  volumes:
    - .:/repo:Z

services:
  db:
    image: docker.io/library/postgres:17-alpine
    container_name: cantina-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cantina}
      POSTGRES_USER: ${POSTGRES_USER:-cantina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cantina}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  install:
    <<: *bun
    container_name: cantina-install
    command: bun install

  server:
    <<: *bun
    container_name: cantina-server
    restart: unless-stopped
    command: bun run dev:server
    environment:
      PORT: 3333
      DATABASE_URL: postgres://${POSTGRES_USER:-cantina}:${POSTGRES_PASSWORD:-cantina}@db:5432/${POSTGRES_DB:-cantina}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      TZ: America/Sao_Paulo
    ports:
      - "${SERVER_PORT:-3333}:3333"
    volumes:
      - .:/repo:Z
      - uploads:/data/uploads
    depends_on:
      install:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  web:
    <<: *bun
    container_name: cantina-web
    restart: unless-stopped
    command: bun run dev:web
    environment:
      API_URL: http://server:3333
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      install:
        condition: service_completed_successfully
      server:
        condition: service_started

volumes:
  db-data:
  uploads:
